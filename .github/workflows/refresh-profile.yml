name: Refresh terminal profile

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * *"
  push:
    branches: [main]
    paths:
      - profile.json
      - art/**
      - scripts/**
      - .github/workflows/refresh-profile.yml

permissions:
  contents: write

concurrency:
  group: refresh-terminal-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Render from public GitHub data
        run: python3 scripts/generate_profile.py
      - name: Commit changed cards
        run: |
          git add assets/terminal-*.svg data/public-profile.json
          if git diff --cached --quiet; then
            echo "The public profile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh public profile data"
          git push origin HEAD:main
